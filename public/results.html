<!DOCTYPE html>
<html lang="en-GB">
<head>
<title>Results · Webinar System</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27%3E%3Crect width=%2726%27 height=%2726%27 rx=%275%27 fill=%27%230E0E10%27/%3E%3Cpath d=%27M7 8l3 10 3-8 3 8 3-10%27 fill=%27none%27 stroke=%27%23F6F6F4%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="ai-page">
<main class="ai-wrap ws-main" id="main">
  <div class="ai-pagehead">
    <p class="ai-label">Results</p>
    <h1 class="ai-h2">How your webinar is doing</h1>
    <p class="ai-body">We follow everyone who signed up in the dates below, step by step, and show you where most people are dropping out.</p>
  </div>
  <div class="ws-tools" style="margin-bottom:20px">
    <div class="ai-seg" id="period" role="group" aria-label="Dates">
      <button type="button" data-days="7">Last 7 days</button><button type="button" data-days="30">Last 30 days</button><button type="button" data-days="90">Last 90 days</button>
    </div>
    <label class="ws-note">From <input type="date" id="from" aria-label="From"></label>
    <label class="ws-note">to <input type="date" id="to" aria-label="To"></label>
    <button type="button" class="ai-btn ai-btn--secondary ai-btn--sm" id="refresh">Refresh now</button>
    <span class="ws-note" id="fresh" role="status"></span>
  </div>
  <div id="notice"></div>
  <div id="view" class="ai-stack" style="--ai-stack: 28px"><p class="ws-note">Loading your numbers…</p></div>
</main>
<script src="/app.js"></script>
<script src="/results.js"></script>
</body>
</html>
